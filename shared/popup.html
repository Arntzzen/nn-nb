<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>Nynorsk til Bokmål</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <main class="container">

    <div class="header">
      <div class="logo">N→B</div>
      <div>
        <h1>Nynorsk til Bokmål</h1>
        <p>Automatisk oversettelse</p>
      </div>
    </div>

    <div class="status-card">
      <div>
        <strong id="stat">Laster...</strong>
        <p>Oversettelse på denne nettsiden</p>
      </div>

      <label class="switch">
        <input type="checkbox" id="toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="footer">
      Firefox · Versjon 1.0.0
    </div>

  </main>

  <script src="popup.js"></script>

</body>
</html>
